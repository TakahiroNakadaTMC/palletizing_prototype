<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>品番カタログ／ケース編集</title>
  <link rel="stylesheet" href="/catalog_viewer.css">
  <script src="/catalog_viewer.js" defer></script>
</head>
<body>
  <header>
    <h1>品番・箱モデルDB／ケース編集</h1>
    <p class="notice"><strong>品番カタログとテストケースを編集します。</strong>
      保存した内容はテスト実行・検証・可視化に使用されます。画面を複数開いている場合、古い版からの保存は拒否されます。</p>
    <nav aria-label="編集画面">
      <a href="/catalog_viewer.html">DB編集</a>
      <a href="/catalog_cases.html">品番ケース編集</a>
    </nav>
    <div class="toolbar">
      <button id="reload" type="button">保存済みデータを再読み込み</button>
      <button id="save" type="button" disabled>変更をまとめて保存</button>
      <span id="dirty" role="status">読み込み中</span>
    </div>
    <p id="feedback" role="status" aria-live="polite"></p>
  </header>
  <main>
    <div id="db-tabs" role="tablist" aria-label="DBの種類">
      <button type="button" role="tab" data-tab="parts" aria-controls="records">品番・箱種DB</button>
      <button type="button" role="tab" data-tab="models" aria-controls="records">箱モデルDB</button>
      <button type="button" role="tab" data-tab="lids" aria-controls="records">蓋DB</button>
      <button type="button" role="tab" data-tab="pallets" aria-controls="records">パレットDB</button>
      <button type="button" role="tab" data-tab="skids" aria-controls="records">スキッドDB</button>
      <button type="button" role="tab" data-tab="suppliers" aria-controls="records">仕入先対応表</button>
    </div>
    <h2 id="section-title">読み込み中</h2>
    <p id="help"></p>
    <div class="toolbar">
      <label>検索 <input id="search" type="search" placeholder="品番・仕入先・箱名称など"></label>
      <button id="add" type="button" disabled>追加</button>
      <button id="approve-all" type="button" hidden>全て採用</button>
      <button id="approve-none" type="button" hidden>全て解除</button>
    </div>
    <p id="counts"></p>
    <div id="records" class="table-wrap" role="tabpanel" aria-label="登録一覧" tabindex="0">
      <table><thead id="table-head"></thead><tbody id="table-body"></tbody></table>
    </div>
  </main>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="edit-form">
      <h2 id="editor-title"></h2>
      <p>入力を確定しても、上の「まとめて保存」を押すまではファイルに保存されません。</p>
      <p id="form-error" role="alert"></p>
      <div id="fields" class="fields"></div>
      <section id="case-lines" hidden>
        <h3>投入品番と数量</h3>
        <p>選択したスキッドの候補品番すべてから数量を入力します。空欄・0は投入しません。箱・モデル・蓋は品番DBから自動表示します。</p>
        <p id="case-skid-info" class="muted"></p>
        <p id="case-skid-blocked" class="error" hidden></p>
        <div id="line-list"></div>
        <p id="line-summary" role="status"></p>
      </section>
      <section id="skid-history" hidden>
        <h3>更新履歴</h3>
        <p id="skid-updated-at" class="muted"></p>
        <ol id="skid-history-list"></ol>
      </section>
      <div class="toolbar">
        <button id="submit-edit" type="submit">入力を確定</button>
        <button id="cancel-edit" type="button">キャンセル</button>
      </div>
    </form>
  </dialog>
</body>
</html>
