<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蓋データベース管理ビューア</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .badge-tp { background-color: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
    .badge-nontp { background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .scale-in { animation: scaleIn 0.2s ease-out; }
    @keyframes scaleIn { from { transform: scale(0.95); } to { transform: scale(1); } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="p-2 bg-indigo-600 text-white rounded-lg shadow-sm">
            <i data-lucide="package-check" class="w-5 h-5"></i>
          </span>
          <h1 class="text-xl font-bold text-slate-900">蓋仕様 採用・編集 承認ビューア</h1>
          <span class="text-xs bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full font-medium border border-indigo-200">lid_db.json</span>
        </div>
        <p class="text-xs text-slate-500 mt-1">パレタイズ用蓋仕様の寸法編集・登録・保存を行います。</p>
      </div>
      <div class="flex items-center flex-wrap gap-2">
        <button id="btn-add-lid" class="px-3.5 py-1.5 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-md transition shadow-sm flex items-center gap-1.5">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> 新しい蓋を追加
        </button>
        <button id="btn-save-all" class="px-4 py-1.5 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-md transition shadow flex items-center gap-1.5">
          <i data-lucide="save" class="w-3.5 h-3.5"></i> lid_db.json に保存
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- Stats Bar -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-500">登録蓋数</p>
          <p class="text-2xl font-black text-slate-900 mt-1" id="stat-lid-count">0</p>
        </div>
        <div class="p-3 bg-slate-100 text-slate-600 rounded-lg"><i data-lucide="layers" class="w-5 h-5"></i></div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-blue-200 shadow-sm flex items-center justify-between bg-blue-50/30">
        <div>
          <p class="text-xs font-semibold text-blue-700">外嵌め蓋</p>
          <p class="text-2xl font-black text-blue-600 mt-1" id="stat-outer-fit">0</p>
        </div>
        <div class="p-3 bg-blue-100 text-blue-700 rounded-lg"><i data-lucide="box" class="w-5 h-5"></i></div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-emerald-200 shadow-sm flex items-center justify-between bg-emerald-50/30">
        <div>
          <p class="text-xs font-semibold text-emerald-700">内嵌め蓋</p>
          <p class="text-2xl font-black text-emerald-600 mt-1" id="stat-inner-fit">0</p>
        </div>
        <div class="p-3 bg-emerald-100 text-emerald-700 rounded-lg"><i data-lucide="box" class="w-5 h-5"></i></div>
      </div>
    </div>

    <!-- Lids Table -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden fade-in">
      <div class="overflow-x-auto">
        <table class="w-full min-w-[1100px] text-left text-xs border-collapse">
          <thead>
            <tr class="bg-slate-50/80 border-b border-slate-200 text-slate-600 font-semibold">
              <th class="py-3.5 px-4">蓋ID</th>
              <th class="py-3.5 px-4">蓋名称</th>
              <th class="py-3.5 px-3">種別</th>
              <th class="py-3.5 px-3">色</th>
              <th class="py-3.5 px-3 text-right">長さ L (mm)</th>
              <th class="py-3.5 px-3 text-right">幅 W (mm)</th>
              <th class="py-3.5 px-3 text-right">厚み (mm)</th>
              <th class="py-3.5 px-3">嵌め方</th>
              <th class="py-3.5 px-4">説明</th>
              <th class="py-3.5 px-3 text-center w-24">操作</th>
            </tr>
          </thead>
          <tbody id="lids-table-body" class="divide-y divide-slate-100 font-normal text-slate-700">
            <!-- Lids will be loaded here -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal for Add/Edit Lid -->
  <div id="modal-lid" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200 p-4">
    <div id="modal-container" class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-xl w-full max-h-[calc(100dvh-2rem)] overflow-y-auto p-6 space-y-5 transform transition-transform duration-200 scale-95">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div class="flex items-center gap-2">
          <div class="p-2 bg-indigo-100 text-indigo-700 rounded-lg"><i data-lucide="edit-3" class="w-5 h-5"></i></div>
          <div>
            <h2 id="modal-title" class="text-base font-bold text-slate-900">蓋の追加</h2>
            <p id="modal-subtitle" class="text-xs text-slate-500 mt-1">新しい蓋仕様をデータベースに登録します</p>
          </div>
        </div>
        <button id="btn-close-modal" class="p-1 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="form-lid" class="space-y-4">
        <!-- Lid ID -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">蓋ID (例: LID-001)</label>
          <input type="text" id="input-lid-id" placeholder="LID-001" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <!-- Name -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">蓋名称</label>
          <input type="text" id="input-lid-name" placeholder="クリア蓋 TP-330系用" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <!-- Type -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">タイプ</label>
          <select id="input-lid-type" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <option value="TP">TP規格</option>
            <option value="NONE">無蓋</option>
            <option value="OTHER">その他</option>
          </select>
        </div>

        <!-- Dimensions -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">長さ L (mm)</label>
            <input type="number" id="input-lid-length" placeholder="335" step="0.1" class="w-full px-3 py-1.5 text-xs font-mono border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">幅 W (mm)</label>
            <input type="number" id="input-lid-width" placeholder="335" step="0.1" class="w-full px-3 py-1.5 text-xs font-mono border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          </div>
        </div>

        <!-- Thickness -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">厚み (mm)</label>
          <input type="number" id="input-lid-thickness" placeholder="15" step="0.1" class="w-full px-3 py-1.5 text-xs font-mono border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <!-- Fit Type -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">嵌め方</label>
          <select id="input-lid-fit-type" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <option value="外嵌め">外嵌め（箱外側面と蓋で位置決め）</option>
            <option value="内嵌め">内嵌め（箱内壁面と蓋で位置決め）</option>
            <option value="なし">なし（無蓋の場合）</option>
          </select>
        </div>

        <div>
          <label for="input-lid-color" class="block text-xs font-bold text-slate-700 mb-1">色（任意）</label>
          <input type="text" id="input-lid-color" placeholder="例: 黒、青、透明" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <!-- Description -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">説明 / 特徴</label>
          <input type="text" id="input-lid-desc" placeholder="対応規格や用途の説明" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <!-- Modal Footer -->
        <div class="flex items-center justify-end gap-2 pt-4 border-t border-slate-100">
          <button type="button" id="btn-cancel-modal" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">キャンセル</button>
          <button type="submit" id="modal-submit-btn" class="px-5 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition shadow flex items-center gap-1.5">
            <i data-lucide="check" class="w-4 h-4"></i> 保存する
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-2.5 rounded-lg shadow-xl text-xs font-medium transform transition-all duration-300 opacity-0 translate-y-4 pointer-events-none flex items-center gap-2 z-50">
    <i data-lucide="check" class="w-4 h-4 text-emerald-400"></i>
    <span id="toast-msg">通知メッセージ</span>
  </div>

  <script>
    // Global Lid DB
    let currentLidDB = {};
    let currentBoxDB = {};
    let boxDbLoaded = false;
    let boxDbChanged = false;
    let editTargetId = null;
    let testCaseLidReferences = {};
    let lidReferencesLoaded = false;

    function normalizeDimensionOrder(db) {
      Object.values(db).forEach(item => {
        const width = Number(item.width);
        const length = Number(item.length);
        if (Number.isFinite(width) && Number.isFinite(length) && width > length) {
          item.width = length;
          item.length = width;
        }
      });
      return db;
    }

    // Toast Notification
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-4');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 3000);
    }

    // Load Lids from API
    async function loadLidsFromServer() {
      try {
        const res = await fetch('/api/lids');
        if (res.ok) {
          currentLidDB = normalizeDimensionOrder(await res.json());
          updateStats();
          renderLidsTable();
          showToast('蓋データをサーバーから読み込みました');
        }
      } catch (error) {
        console.warn('Could not load from server:', error);
      }
    }

    async function loadLidReferences() {
      try {
        const response = await fetch('/api/lid_references');
        if (!response.ok) throw new Error('蓋のテストケース参照を読み込めませんでした');
        testCaseLidReferences = await response.json();
        lidReferencesLoaded = true;
      } catch (error) {
        lidReferencesLoaded = false;
        console.error('Lid reference load error:', error);
      }
      renderLidsTable();
      return lidReferencesLoaded;
    }

    // Update Statistics
    function updateStats() {
      const totalLids = Object.keys(currentLidDB).length;
      const outerFitLids = Object.values(currentLidDB).filter(l => l.fit_type === '外嵌め').length;
      const innerFitLids = Object.values(currentLidDB).filter(l => l.fit_type === '内嵌め').length;

      document.getElementById('stat-lid-count').textContent = totalLids;
      document.getElementById('stat-outer-fit').textContent = outerFitLids;
      document.getElementById('stat-inner-fit').textContent = innerFitLids;
    }

    // Render Lids Table
    function renderLidsTable() {
      const tbody = document.getElementById('lids-table-body');
      tbody.innerHTML = '';

      if (Object.keys(currentLidDB).length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" class="px-4 py-8 text-center text-slate-500">登録された蓋がありません</td></tr>`;
        return;
      }

      Object.entries(currentLidDB).forEach(([lidId, lid]) => {
        const row = document.createElement('tr');
        row.className = 'hover:bg-slate-50 transition';
        const typeDisplay = {
          TP: { label: 'TP規格', className: 'badge-tp' },
          NONE: { label: '無蓋', className: 'bg-slate-100 text-slate-700 border border-slate-200' },
          OTHER: { label: 'その他', className: 'badge-nontp' }
        }[lid.type] || { label: lid.type || '未設定', className: 'bg-slate-100 text-slate-600 border border-slate-200' };
        const canDelete = boxDbLoaded && lidReferencesLoaded;
        row.innerHTML = `
          <td class="py-3 px-4 font-mono font-bold text-slate-900">${lid.id}</td>
          <td class="py-3 px-4 font-medium text-slate-800">${lid.name}</td>
          <td class="py-3 px-3"><span class="inline-block px-2 py-0.5 rounded text-[11px] font-bold ${typeDisplay.className}">${typeDisplay.label}</span></td>
          <td class="lid-color py-3 px-3 text-slate-600 whitespace-nowrap"></td>
          <td class="py-3 px-3 text-right font-mono font-semibold">${lid.length}</td>
          <td class="py-3 px-3 text-right font-mono font-semibold">${lid.width}</td>
          <td class="py-3 px-3 text-right font-mono text-slate-600">${lid.thickness}</td>
          <td class="py-3 px-3">
            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium ${
              lid.fit_type === '外嵌め' ? 'bg-blue-100 text-blue-700' :
              lid.fit_type === '内嵌め' ? 'bg-purple-100 text-purple-700' :
              'bg-slate-100 text-slate-700'
            }">
              ${lid.fit_type || '未設定'}
            </span>
          </td>
          <td class="py-3 px-4 text-slate-500 max-w-xs truncate" title="${lid.description || ''}">${lid.description || '—'}</td>
          <td class="py-3 px-3 text-center">
            <div class="inline-flex items-center gap-1">
              <button class="p-1 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded transition" title="この蓋の寸法・仕様を変更" onclick="openModal('${lidId}')">
                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
              </button>
              <button class="delete-lid-btn p-1 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded transition disabled:opacity-40 disabled:cursor-not-allowed" data-lid-id="${lidId}" title="${canDelete ? 'この蓋を削除' : '箱DB・テストケース参照の確認中'}" ${canDelete ? '' : 'disabled'}>
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </td>
        `;
        row.querySelector('.lid-color').textContent = lid.color || '未設定';
        tbody.appendChild(row);
      });

      tbody.querySelectorAll('.delete-lid-btn').forEach(button => {
        button.addEventListener('click', () => deleteLid(button.dataset.lidId));
      });
      lucide.createIcons();
    }

    async function deleteLid(lidId) {
      if (!boxDbLoaded || !await loadLidReferences()) {
        showToast('箱DBまたはテストケース参照を確認できないため削除できません');
        return;
      }

      const lid = currentLidDB[lidId];
      if (!lid) return;

      const remainingNoLidOptions = Object.entries(currentLidDB)
        .filter(([id, item]) => id !== lidId && item.type === 'NONE');
      if (lid.type === 'NONE' && remainingNoLidOptions.length === 0) {
        showToast('最後の「無蓋」は既定値のため削除できません');
        return;
      }

      const testCases = testCaseLidReferences[lidId] || [];
      if (testCases.length > 0) {
        alert(`蓋 "${lidId}" はテストケースから参照されているため削除できません。\n\n${testCases.join('\n')}`);
        return;
      }

      const compatibleBoxes = Object.entries(currentBoxDB)
        .filter(([, box]) => Array.isArray(box.compatible_lids) && box.compatible_lids.includes(lidId));
      const boxNotice = compatibleBoxes.length > 0
        ? `\n\n互換蓋として登録されている ${compatibleBoxes.length} 件の箱からも参照を削除します。`
        : '';
      if (!confirm(`蓋 "${lid.name}" (${lidId}) を削除しますか？${boxNotice}\n\n「lid_db.json に保存」を押すと確定します。`)) return;

      delete currentLidDB[lidId];
      compatibleBoxes.forEach(([, box]) => {
        box.compatible_lids = box.compatible_lids.filter(id => id !== lidId);
      });
      if (compatibleBoxes.length > 0) boxDbChanged = true;

      updateStats();
      renderLidsTable();
      showToast(`蓋 "${lid.name}" を削除しました。保存ボタンで確定してください`);
    }

    // Modal Control
    const modal = document.getElementById('modal-lid');
    const modalContainer = document.getElementById('modal-container');

    function openModal(lidId = null) {
      editTargetId = lidId;
      const modalTitle = document.getElementById('modal-title');
      const modalSub = document.getElementById('modal-subtitle');
      const modalBtn = document.getElementById('modal-submit-btn');

      if (lidId && currentLidDB[lidId]) {
        const lid = currentLidDB[lidId];
        modalTitle.textContent = `蓋仕様の編集 (${lid.id})`;
        modalSub.textContent = `寸法、嵌め方等のパラメータを変更します`;
        modalBtn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> 更新して保存`;

        document.getElementById('input-lid-id').value = lid.id;
        document.getElementById('input-lid-id').disabled = false;
        document.getElementById('input-lid-name').value = lid.name || '';
        document.getElementById('input-lid-type').value = lid.type || 'TP';
        document.getElementById('input-lid-width').value = lid.width;
        document.getElementById('input-lid-length').value = lid.length;
        document.getElementById('input-lid-thickness').value = lid.thickness;
        document.getElementById('input-lid-fit-type').value = lid.fit_type || '外嵌め';
        document.getElementById('input-lid-desc').value = lid.description || '';
        document.getElementById('input-lid-color').value = lid.color || '';
      } else {
        modalTitle.textContent = `新しい蓋を登録`;
        modalSub.textContent = `新しい蓋仕様をデータベースに追加します`;
        modalBtn.innerHTML = `<i data-lucide="plus" class="w-4 h-4"></i> 登録する`;

        document.getElementById('form-lid').reset();
        document.getElementById('input-lid-id').disabled = false;
        document.getElementById('input-lid-thickness').value = '15';
        document.getElementById('input-lid-fit-type').value = '外嵌め';
      }

      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modalContainer.classList.remove('scale-95');
        modalContainer.classList.add('scale-100');
        document.getElementById('input-lid-id').focus();
        lucide.createIcons();
      }, 10);
    }

    function closeModal() {
      modal.classList.add('opacity-0');
      modalContainer.classList.remove('scale-100');
      modalContainer.classList.add('scale-95');
      modal.classList.add('hidden');
      editTargetId = null;
    }

    // Form Submit
    document.getElementById('form-lid').addEventListener('submit', (e) => {
      e.preventDefault();

      const id = document.getElementById('input-lid-id').value.trim();
      const name = document.getElementById('input-lid-name').value.trim();
      const type = document.getElementById('input-lid-type').value;
      const width = parseFloat(document.getElementById('input-lid-width').value) || 0;
      const length = parseFloat(document.getElementById('input-lid-length').value) || 0;
      const thickness = parseFloat(document.getElementById('input-lid-thickness').value) || 0;
      const fitType = document.getElementById('input-lid-fit-type').value;
      const description = document.getElementById('input-lid-desc').value.trim();
      const color = document.getElementById('input-lid-color').value.trim();

      if (!id || !name) {
        showToast('蓋IDと蓋名称は必須です');
        return;
      }
      if (length < width) {
        showToast('長さ L は幅 W 以上の値を入力してください');
        return;
      }

      if (editTargetId && id !== editTargetId && currentLidDB[id]) {
        showToast(`蓋ID "${id}" はすでに使用されています`);
        return;
      }

      if (editTargetId && id !== editTargetId && !boxDbLoaded) {
        showToast('箱DBを読み込めないため、IDを変更できません');
        return;
      }

      if (editTargetId && id !== editTargetId) {
        delete currentLidDB[editTargetId];
        Object.values(currentBoxDB).forEach(box => {
          if (Array.isArray(box.compatible_lids) && box.compatible_lids.includes(editTargetId)) {
            box.compatible_lids = [...new Set(box.compatible_lids.map(lidId => lidId === editTargetId ? id : lidId))];
          }
        });
        boxDbChanged = true;
      }

      currentLidDB[id] = { id, name, type, length, width, thickness, fit_type: fitType, color, description };
      updateStats();
      renderLidsTable();
      closeModal();
      showToast(`蓋 "${name}" を${editTargetId ? '更新' : '登録'}しました`);
    });

    // Event Listeners
    document.getElementById('btn-add-lid').addEventListener('click', () => openModal());
    document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);
    document.getElementById('btn-close-modal').addEventListener('click', closeModal);

    document.getElementById('btn-save-all').addEventListener('click', async () => {
      try {
        const saves = [fetch('/api/lids/save_all', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(currentLidDB)
        })];
        if (boxDbChanged) {
          saves.push(fetch('/api/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(currentBoxDB)
          }));
        }
        const responses = await Promise.all(saves);
        if (responses.every(res => res.ok)) {
          boxDbChanged = false;
          showToast('蓋DBと箱DBを保存しました');
        } else {
          showToast('保存に失敗しました');
        }
      } catch (error) {
        console.error('Save error:', error);
        showToast('通信エラーが発生しました');
      }
    });

    // Initialize
    window.addEventListener('load', async () => {
      await loadLidsFromServer();
      try {
        const response = await fetch('/api/boxes');
        if (!response.ok) throw new Error('箱DBの読み込みに失敗しました');
        currentBoxDB = normalizeDimensionOrder(await response.json());
        boxDbLoaded = true;
      } catch (error) {
        console.error('Box DB load error:', error);
        showToast('箱DBを読み込めませんでした');
      }
      await loadLidReferences();
    });
  </script>
</body>
</html>
